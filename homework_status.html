<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>Homework Summary</title>
    <style>
        :root {
            --bg-color: #F5F5F7;
            --card-bg: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --text-tertiary: #A1A1A6;
            --border-color: rgba(0, 0, 0, 0.08);
            --apple-red: #FF3B30;
            --apple-green: #34C759;
            --apple-orange: #FF9500;
            --apple-blue: #007AFF;
            --input-bg: #F2F2F7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 50px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-text h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--text-primary);
        }

        /* Filters Section */
        .filters {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            align-items: flex-end;
            padding: 0 8px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .filter-group label.group-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* Shared Input Style */
        .filter-select, .multi-select-header {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid transparent;
            background-color: var(--card-bg);
            font-size: 14px;
            color: var(--text-primary);
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            box-sizing: border-box;
            width: 100%;
            height: 40px;
        }

        .filter-select:hover, .multi-select-header:hover {
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .filter-select:focus {
            background-color: var(--card-bg);
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        /* Segmented Control */
        .segmented-control {
            display: flex;
            background-color: #E3E3E8;
            padding: 3px;
            border-radius: 10px;
            height: 40px;
            box-sizing: border-box;
        }
        
        .segmented-control label {
            flex: 1;
            text-align: center;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 7px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .segmented-control input[type="radio"] {
            display: none;
        }
        
        .segmented-control input[type="radio"]:checked + label {
            background-color: var(--card-bg);
            box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04);
            font-weight: 600;
        }

        /* Multi-select styling */
        .multi-select-container {
            position: relative;
        }

        .multi-select-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 100;
            display: none;
            overflow: hidden;
            padding: 6px;
        }

        .multi-select-dropdown.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .multi-select-option {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            border-radius: 6px;
            transition: background 0.15s;
        }

        .multi-select-option:hover {
            background-color: var(--input-bg);
        }

        .multi-select-option input[type="checkbox"] {
            accent-color: var(--apple-blue);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .dropdown-icon {
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* Table Section */
        .table-container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0,0,0,0.02);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 16px 24px;
            font-size: 14px;
        }

        th {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            transition: background-color 0.2s;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #F9F9FB;
        }

        .class-cell {
            font-weight: 600;
            color: var(--text-primary);
            width: 22%;
        }

        .type-cell {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .hw-title {
            font-weight: 500;
            color: var(--text-primary);
        }

        .date-cell {
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Status & Badges */
        .status-red {
            color: var(--apple-red);
            font-weight: 500;
            white-space: nowrap;
        }

        .status-yellow {
            color: var(--apple-orange);
            font-weight: 500;
            white-space: nowrap;
        }

        .status-normal {
            color: var(--text-secondary);
            font-weight: 400;
            white-space: nowrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            min-width: 24px;
            height: 24px;
        }

        .badge-a {
            background-color: #E6F4EA;
            color: #1E8E3E;
        }

        .badge-b {
            background-color: #FEF0DB;
            color: #B06000;
        }

        .badge-c {
            background-color: #FFF5CC;
            color: #997A00;
        }

        .badge-f {
            background-color: #FFE5E5;
            color: var(--apple-red);
        }

        .score-cell {
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
        }

        .empty-state {
            display: none;
            padding: 60px 40px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
        }

        .refresh-time {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .time-value {
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

    function renderSummaryTable() {
        const section = document.getElementById('summary-section');
        const tbody = document.getElementById('summary-table-body');
        
        if (!summaryData || summaryData.length === 0) {
            section.style.display = 'none';
            return;
        }
        
        section.style.display = 'block';
        tbody.innerHTML = '';
        
        summaryData.forEach(s => {
            const tr = document.createElement('tr');
            
            let gradeHtml = s.grade || '-';
            if (s.grade && s.grade.toUpperCase() === 'A') {
                gradeHtml = `<span class="badge badge-a">A</span>`;
            } else if (s.grade && s.grade.toUpperCase() === 'B') {
                gradeHtml = `<span class="badge badge-b">B</span>`;
            } else if (s.grade && s.grade.toUpperCase() === 'C') {
                gradeHtml = `<span class="badge badge-c">C</span>`;
            } else if (s.grade && s.grade.toUpperCase() === 'F') {
                gradeHtml = `<span class="badge badge-f">F</span>`;
            }
            
            tr.innerHTML = `
                <td class="class-cell" style="border-bottom: 1px solid var(--border-color);">${s.class}</td>
                <td>${gradeHtml}</td>
                <td class="score-cell">${s.score || '-'}</td>
            `;
            tbody.appendChild(tr);
        });
    }


    // App Initialization
    document.addEventListener("DOMContentLoaded", () => {
        if(tasks && tasks.length > 0) {
            populateClassFilter();
            renderSummaryTable();
            renderTable();
        }
    });

    function populateClassFilter() {
        const classDropdown = document.getElementById('class-filter');
        const uniqueClasses = [...new Set(tasks.map(t => t.class))].sort();
        let html = '<option value="all">All Classes</option>';
        uniqueClasses.forEach(c => {
            html += `<option value="${c}">${c}</option>`;
        });
        classDropdown.innerHTML = html;
    }

    // Handle multi-select dropdown UI
    function toggleDropdown(event, dropdownId) {
        event.stopPropagation();
        const target = document.getElementById(dropdownId);
        const dropdowns = document.getElementsByClassName("multi-select-dropdown");
        for (let i = 0; i < dropdowns.length; i++) {
            if (dropdowns[i] !== target && dropdowns[i].classList.contains('show')) {
                dropdowns[i].classList.remove('show');
            }
        }
        if (target) {
            target.classList.toggle('show');
        }
    }

    // Close dropdown when clicking outside
    window.onclick = function(event) {
        if (!event.target.closest('.multi-select-container')) {
            const dropdowns = document.getElementsByClassName("multi-select-dropdown");
            for (let i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }
    }

    // Core Rendering Logic
    function renderTable() {
        const classFilter = document.getElementById('class-filter').value;
        const typeFilter = document.querySelector('input[name="type-filter"]:checked').value;

        const statusCheckboxes = document.querySelectorAll('.status-checkbox:checked');
        const selectedStatuses = Array.from(statusCheckboxes).map(cb => cb.value);
        const totalStatuses = document.querySelectorAll('.status-checkbox').length;
        
        const timelineCheckboxes = document.querySelectorAll('.timeline-checkbox:checked');
        const selectedTimelines = Array.from(timelineCheckboxes).map(cb => cb.value);
        const totalTimelines = document.querySelectorAll('.timeline-checkbox').length;
        
        // Update header text for Status
        const statusHeaderText = document.getElementById('status-header-text');
        if (selectedStatuses.length === totalStatuses) {
            statusHeaderText.textContent = 'All Statuses';
        } else if (selectedStatuses.length === 0) {
            statusHeaderText.textContent = 'None Selected';
        } else {
            statusHeaderText.textContent = selectedStatuses.length + ' Selected';
        }

        // Update header text for Timeline
        const timelineHeaderText = document.getElementById('timeline-header-text');
        if (selectedTimelines.length === totalTimelines) {
            timelineHeaderText.textContent = 'All Timelines';
        } else if (selectedTimelines.length === 0) {
            timelineHeaderText.textContent = 'None Selected';
        } else {
            timelineHeaderText.textContent = selectedTimelines.length + ' Selected';
        }

        const today = new Date();
        today.setHours(0,0,0,0);
        const next7Days = new Date(today);
        next7Days.setDate(today.getDate() + 7);

        // Apply filters
        let filteredTasks = tasks.filter(t => {
            const classMatch = (classFilter === 'all' || t.class === classFilter);
            const typeMatch = (typeFilter === 'all' || t.type === typeFilter);
            const statusMatch = selectedStatuses.includes(t.status);
            
            let timelineMatch = false;
            if (t.due) {
                const dueDate = new Date(t.due);
                dueDate.setHours(0,0,0,0);
                if (dueDate < today) {
                    timelineMatch = selectedTimelines.includes('Missed');
                } else if (dueDate <= next7Days) {
                    timelineMatch = selectedTimelines.includes('Next7Days');
                } else {
                    timelineMatch = selectedTimelines.includes('Future');
                }
            } else {
                timelineMatch = selectedTimelines.includes('Future');
            }
            
            return classMatch && typeMatch && statusMatch && timelineMatch;
        });

        // Sort by Class to group them together properly
        filteredTasks.sort((a, b) => a.class.localeCompare(b.class));

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        
        const emptyState = document.getElementById('empty-state');

        if (filteredTasks.length === 0) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';

            let lastClass = null;
            let lastClassCell = null;

            filteredTasks.forEach(t => {
                const tr = document.createElement('tr');
                
                let statusHtml = '';
                if (t.status === 'Not Submitted' || t.status === 'Not Taken') {
                    statusHtml = `<span class="status-red">${t.status}</span>`;
                } else if (t.status === 'To be Confirmed') {
                    statusHtml = `<span class="status-yellow">${t.status}</span>`;
                } else {
                    statusHtml = `<span class="status-normal">${t.status}</span>`;
                }

                let gradeHtml = t.grade || '-';
                if (t.grade && t.grade.toUpperCase() === 'A') {
                    gradeHtml = `<span class="badge badge-a">A</span>`;
                } else if (t.grade && t.grade.toUpperCase() === 'B') {
                    gradeHtml = `<span class="badge badge-b">B</span>`;
                } else if (t.grade && t.grade.toUpperCase() === 'C') {
                    gradeHtml = `<span class="badge badge-c">C</span>`;
                } else if (t.grade && t.grade.toUpperCase() === 'F') {
                    gradeHtml = `<span class="badge badge-f">F</span>`;
                }

                // Grouping Logic
                const showClass = (t.class !== lastClass);
                const classCellContent = showClass ? t.class : '';
                const classCellStyle = showClass ? '' : 'border-bottom: none;';
                
                if (showClass && lastClassCell) {
                    // Restore bottom border to the previous group's final row
                    lastClassCell.style.borderBottom = '';
                }

                tr.innerHTML = `
                    <td class="class-cell" style="${classCellStyle}">${classCellContent}</td>
                    <td class="type-cell">${t.type}</td>
                    <td class="hw-title">${t.task}</td>
                    <td class="date-cell">${t.due}</td>
                    <td>${statusHtml}</td>
                    <td>${gradeHtml}</td>
                    <td class="score-cell">${t.score || '-'}</td>
                `;
                
                tbody.appendChild(tr);

                lastClassCell = tr.querySelector('.class-cell');
                lastClass = t.class;
            });
            
            // Ensure the very last row always has a border
            if (lastClassCell) {
                lastClassCell.style.borderBottom = '';
            }
        }
    }
